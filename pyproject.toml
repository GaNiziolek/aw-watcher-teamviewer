[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-watcher-teamviewer"
version = "0.1.0"
description = "ActivityWatch watcher that records TeamViewer sessions from TeamViewer's connection logs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
classifiers = ["Operating System :: Microsoft :: Windows"]

[project.scripts]
aw-watcher-teamviewer = "aw_watcher_teamviewer:main"

[tool.setuptools]
packages = ["aw_watcher_teamviewer"]
